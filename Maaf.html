<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kobalt:#1445b8;      /* ground: langit sebelum hujan */
  --malam:#0a2463;       /* sisi gelap, bagian jawaban */
  --kertas:#f2f6fd;      /* kertas surat */
  --tinta:#0d2b7a;       /* tinta pena biru */
  --kabut:#a9c0f0;       /* teks sekunder di atas biru */
  --lilin:#ffd66b;       /* hanya untuk fokus dan penanda */
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-tulis:"Kalam","Segoe Print","Bradley Hand",cursive;
  --s1:.5rem;--s2:1rem;--s3:2rem;--s4:4rem;--s5:7rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--kobalt:#0f368f;--malam:#071a4a;--kertas:#e9eff9;}
}
:root[data-theme="dark"]{--kobalt:#0f368f;--malam:#071a4a;--kertas:#e9eff9;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--kobalt);color:var(--kertas);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}

/* Hero: tipografi adalah gambarnya */
.hero{min-height:78svh;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4) var(--s3) var(--s3);max-width:72rem;margin:0 auto}
.hero h1{font-weight:900;font-size:clamp(5.5rem,27vw,20rem);line-height:.8;letter-spacing:-.02em;margin:0;color:var(--kertas)}
.hero p{margin:var(--s3) 0 0;max-width:26rem;font-size:1.125rem;line-height:1.5;color:var(--kabut)}

/* Surat */
.surat-wrap{padding:var(--s3) var(--s3) var(--s5);max-width:72rem;margin:0 auto}
.surat{background:var(--kertas);color:var(--tinta);max-width:36rem;margin-left:auto;padding:var(--s3) var(--s3) var(--s4);border-radius:3px;transform:rotate(-1.2deg);box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(5,18,60,.65)}
.surat p{font-family:var(--font-tulis);font-size:clamp(1.2rem,4.2vw,1.45rem);line-height:1.75;margin:0 0 1.1rem;max-width:34ch}
.surat .ttd{font-weight:700;margin-top:1.6rem}

/* Satu momen gerak: tulisan muncul dari kiri ke kanan */
.surat p{clip-path:inset(0 100% 0 0);animation:tulis 1.1s cubic-bezier(.3,.6,.2,1) forwards;animation-delay:calc(.6s + var(--i)*.85s)}
@keyframes tulis{to{clip-path:inset(0 0 0 0)}}

/* Jawaban */
.jawab{background:var(--malam);padding:var(--s5) var(--s3) calc(var(--s5) + env(safe-area-inset-bottom,0px))}
.jawab-in{max-width:36rem;margin:0 auto}
.jawab h2{font-size:clamp(1.75rem,6vw,2.5rem);line-height:1.1;margin:0 0 var(--s3);font-weight:800}
.pilihan{display:flex;flex-wrap:wrap;gap:var(--s2)}
button{font:700 1.0625rem/1.2 var(--font-ui);padding:1rem 1.4rem;border-radius:4px;cursor:pointer;min-height:3rem}
.ya{background:var(--kertas);color:var(--malam);border:2px solid var(--kertas)}
.nanti{background:transparent;color:var(--kertas);border:2px solid var(--kabut);border-radius:999px}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:3px solid var(--lilin);outline-offset:3px}
.balas{margin:var(--s3) 0 0;min-height:4.5rem;font-family:var(--font-tulis);font-size:1.5rem;line-height:1.5;color:var(--kertas)}
.balas:empty{min-height:0}

@media (min-width:48rem){
  .hero,.surat-wrap{padding-left:var(--s4);padding-right:var(--s4)}
  .surat{padding:var(--s4) var(--s4) var(--s4);margin-right:6%}
}
@media (prefers-reduced-motion:reduce){
  .surat p{animation:none;clip-path:none}
}
</style>
</head>
<body>
<header class="hero">
  <h1>Maaf.</h1>
  <p id="pengantar">Aku menulis ini langsung, tanpa basa-basi.</p>
</header>

<main>
  <section class="surat-wrap" aria-label="Surat permintaan maaf">
    <article class="surat" id="surat"></article>
  </section>

  <section class="jawab" aria-labelledby="judul-jawab">
    <div class="jawab-in">
      <h2 id="judul-jawab">Kamu tidak harus menjawab sekarang.</h2>
      <div class="pilihan">
        <button class="ya" type="button" data-k="ya">Aku terima permintaan maafmu</button>
        <button class="nanti" type="button" data-k="nanti">Aku butuh waktu dulu</button>
      </div>
      <p class="balas" id="balas" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
/* Ganti dua nilai ini, dan sesuaikan kalimat di LINES agar cocok dengan yang sebenarnya terjadi. */
const NAMA = "kamu";
const PENGIRIM = "aku";

const LINES = [
  "Untuk " + NAMA + ",",
  "Aku tahu kata maaf tidak langsung memperbaiki apa pun. Tapi aku tidak mau menundanya.",
  "Aku salah. Aku menyakitimu, dan itu bukan hal kecil.",
  "Aku tidak akan mencari alasan. Yang bisa kulakukan adalah mengakuinya, dan mendengarkan kalau kamu mau bercerita.",
  "Ambil waktu sebanyak yang kamu perlukan.",
  "Dari " + PENGIRIM
];
const BALASAN = {
  ya: "Terima kasih. Aku akan menjaga kepercayaan itu.",
  nanti: "Tentu. Aku akan menunggu, tanpa mendesak."
};

const surat = document.getElementById("surat");
LINES.forEach(function(t, i){
  const p = document.createElement("p");
  p.textContent = t;
  p.style.setProperty("--i", i);
  if (i === LINES.length - 1) p.className = "ttd";
  surat.appendChild(p);
});

const balas = document.getElementById("balas");
document.querySelectorAll("button[data-k]").forEach(function(b){
  b.addEventListener("click", function(){
    balas.textContent = BALASAN[b.dataset.k];
  });
});
</script>
</body>
</html>
